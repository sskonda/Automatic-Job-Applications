review_required_claims:
  - issue: GPA conflict
    details:
      - The June 7 general resume reports 3.57.
      - The June 7 CV reports 3.83.
      - Authenticated LinkedIn does not display a GPA.
    action: Do not submit a GPA until Sanat confirms the correct value and whether it is undergraduate, graduate, or cumulative.
  - issue: Current-location conflict
    details:
      - The resume uses Tampa, Florida.
      - Authenticated LinkedIn uses Gainesville, Florida.
    action: The profile treats Gainesville as the current location and Tampa as the home location; confirm which should appear on applications.
  - issue: Ford title and end-date variants
    details:
      - The CV describes a May-August 2026 embedded software or firmware internship.
      - Authenticated LinkedIn lists Firmware Engineer, Internship, May 2026 to present.
    action: Use Firmware Engineer Intern and May 2026 to present during the internship; confirm the final title and end date after completion.
  - issue: System-on-Chip TA date conflict
    details:
      - The general resume says January 2026 to present.
      - The CV and authenticated LinkedIn say January 2026 to May 2026.
    action: Use January-May 2026 unless Sanat confirms the role continues.
  - issue: Honeywell end-date conflict
    details:
      - The resume and CV say May-August 2025.
      - Authenticated LinkedIn says May-November 2025.
    action: Keep May-August 2025 in automatic materials until Sanat confirms whether the role continued through November.
  - issue: Machine Intelligence Laboratory date and platform conflicts
    details:
      - The resume/CV say January 2023 to August 2025 and refer to an NVIDIA Jetson Nano.
      - Authenticated LinkedIn says January 2024 to November 2025 and refers to an NVIDIA Jetson Orin.
    action: Do not change dates or Jetson model automatically until Sanat confirms the correct history.
  - issue: UF Information Technology title and date conflict
    details:
      - The resume/CV describe a Software Engineering Intern role from January-August 2023.
      - Authenticated LinkedIn lists Cybersecurity Engineering Intern from January 2023 to January 2025.
    action: Keep the resume/CV version in automatic materials until the title and dates are reconciled.
  - issue: Student-organization date conflicts
    details:
      - Resume/CV and LinkedIn report different start and end months for the Space Systems Design Club, IEEE, and IAM3D leadership roles.
    action: Use role names and responsibilities freely, but confirm exact dates before copying them into a formal work-history field.
  - issue: IEEE robotics platform conflict
    details:
      - The resume/CV and LinkedIn experience describe a Zynq-7000 ROS pipeline with acceleration metrics.
      - The public IEEE repository documents a Raspberry Pi 4, Pi Camera 2, AprilTags, and ultrasonic sensors.
    action: Use the public repository description; do not use the Zynq implementation or performance metrics without clarification.
  - issue: LinkedIn-only advanced-computing claims lack portfolio evidence
    details:
      - The About section describes a 256-bit Zynq RSA engine with a 20x speedup.
      - It also describes an RTOS Vision SoC and a custom ARM Cortex-M4 UAV micro-kernel.
      - No matching public repository, resume entry, or detailed LinkedIn project was identified.
    action: Keep these projects out of generated materials until artifacts or additional documentation are supplied.
  - issue: Quantitative metrics need confirmation before automatic use
    details:
      - Honeywell 95 percent transmission success and 30 percent build-cycle reduction
      - UF IT 50 percent fault-isolation reduction
      - CANSAT 40 percent latency reduction and 100 percent packet integrity
      - IEEE robotics 3x latency, 20 percent power, and 25 Hz mapping claims
      - Rover QSPI current below 1 amp and RSA 20x acceleration
    action: Keep all uncorroborated metrics out of generated materials unless explicitly approved.
  - issue: LinkedIn wording contains technical credibility risks
    details:
      - The UF IT description calls PAM4 optics encrypted, although PAM4 is a modulation format rather than encryption.
      - The MIL description calls Spartan-7 a SoC, although Spartan-7 is an FPGA family.
      - The Honeywell description refers to real-time trading applications, which is not corroborated by the aerospace internship materials.
      - The Ford description currently reads only "Wrote code or something."
    action: Never use these phrases automatically; revise the LinkedIn entries before relying on them externally.

